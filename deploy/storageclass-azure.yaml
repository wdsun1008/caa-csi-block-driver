# Source: caa-csi-block-driver/templates/storageclass.yaml
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: caa-csi-block-plugin-azure
  labels:
    app.kubernetes.io/name: caa-csi-block-driver
    app.kubernetes.io/instance: caa-csi-block
    app.kubernetes.io/version: "0.2.0"
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: caa-csi-block-driver-0.2.0
provisioner: caa-csi-block.csi.confidentialcontainers.io
reclaimPolicy: Delete
volumeBindingMode: Immediate
allowVolumeExpansion: true
parameters:
  cloudProvider: azure
  azureSubscriptionId: "AZURE_SUBSCRIPTION_ID"
  azureResourceGroup: "AZURE_RESOURCE_GROUP"
  azureLocation: "AZURE_LOCATION"
  azureDiskSku: "StandardSSD_LRS"
