name: CSI Sanity Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  csi-sanity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: azure/setup-helm@v4.3.0
        with:
          version: v3.17.3

      - name: Unit, race, vet, and deployment checks
        run: |
          make lint
          go test -race ./...

      - name: Build driver and run csi-sanity tests
        run: make test-verbose
