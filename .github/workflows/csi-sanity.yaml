name: CSI Sanity Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  csi-sanity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build driver and run csi-sanity tests
        run: make test-verbose
