# Cloud provider: alibabacloud, aws, azure, or libvirt
provider: aws

nameOverride: ""
fullnameOverride: ""

image:
  repository: ghcr.io/confidential-devhub/caa-csi-block-driver
  tag: 0.2.0
  pullPolicy: IfNotPresent

namespace:
  name: caa-csi-block
  create: true

sidecarImages:
  provisioner: registry.k8s.io/sig-storage/csi-provisioner:v3.6.0
  resizer: registry.k8s.io/sig-storage/csi-resizer:v1.11.2
  nodeDriverRegistrar: registry.k8s.io/sig-storage/csi-node-driver-registrar:v2.9.0

csiDriver:
  name: caa-csi-block.csi.confidentialcontainers.io

# AWS provider settings
aws:
  region: ""
  # Optional. Pin EBS to this AZ. Recommended when CAA uses a single AWS_SUBNET_ID
  # (disk AZ must match the PodVM subnet). Omit only with WaitForFirstConsumer when
  # the PodVM AZ is the same as the worker node AZ.
  availabilityZone: ""
  volumeType: gp3
  irsa:
    enabled: false
    roleArn: ""
  staticCredentials:
    enabled: false
    secretName: caa-csi-aws-creds

# Azure provider settings
azure:
  subscriptionId: ""
  resourceGroup: ""
  location: ""
  diskSku: StandardSSD_LRS

# Libvirt provider settings
libvirt:
  volumeDir: /var/lib/caa-csi-volumes

# Alibaba Cloud ESSD settings
alibabacloud:
  region: ""
  zoneId: ""
  clusterId: ""
  diskCategory: cloud_essd
  performanceLevel: PL0
  resourceGroupId: ""
  # Leave empty to use RRSA or the Alibaba Cloud default credential chain.
  credentialsSecret: ""
  rrsa:
    enabled: false
    roleArn: ""
    oidcProviderArn: ""
    tokenFile: /var/run/secrets/ack.alibabacloud.com/rrsa-tokens/token

# CDH encryption settings (optional, for LUKS via CAA).
# kbs-key-id is the KBS path without the kbs:/// prefix.
# Example: default/luks-key/volume-key
cdh:
  enabled: false
  encryptionType: luks2
  key: ""

storageClass:
  create: true
  name: ""
  reclaimPolicy: Delete
  volumeBindingMode: Immediate
  # null selects the provider default: false for Alibaba Cloud, true otherwise.
  allowVolumeExpansion: null

controller:
  # Required for libvirt: pin the controller and node plugin to the same host.
  nodeSelector: {}
  state:
    size: 1Gi
    # This must be a host-cluster StorageClass, never this CSI driver itself.
    storageClassName: ""

serviceAccount:
  create: true
  name: ""
  annotations: {}

resources:
  driver:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi
  provisioner:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi
  nodeDriverRegistrar:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      cpu: 50m
      memory: 64Mi

nodePlugin:
  privileged: true
